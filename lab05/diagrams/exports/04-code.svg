<text xml:space="preserve" text-anchor="middle" x="581" y="-620.5" font-family="Helvetica,sans-Serif" font-size="13.00" fill="white">ReservationService [class]</text>
<text xml:space="preserve" text-anchor="middle" x="581" y="-607" font-family="Helvetica,sans-Serif" font-size="13.00" fill="white">reserve(identity: IdentityResult,</text>
<text xml:space="preserve" text-anchor="middle" x="581" y="-593.5" font-family="Helvetica,sans-Serif" font-size="13.00" fill="white">workshop_id: WorkshopId) → ReservationResult</text>
<text xml:space="preserve" text-anchor="middle" x="581" y="-577.75" font-family="Helvetica,sans-Serif" font-size="13.00" fill="white">1. Reject Unverified immediately.</text>
<text xml:space="preserve" text-anchor="middle" x="581" y="-564.25" font-family="Helvetica,sans-Serif" font-size="13.00" fill="white">2. Begin transaction; lock workshop row.</text>
<text xml:space="preserve" text-anchor="middle" x="581" y="-550.75" font-family="Helvetica,sans-Serif" font-size="13.00" fill="white">3. Not found → Rejected(NotFound).</text>
<text xml:space="preserve" text-anchor="middle" x="581" y="-535" font-family="Helvetica,sans-Serif" font-size="13.00" fill="white">4. Existing reservation → Existing unchanged; no email.</text>
<text xml:space="preserve" text-anchor="middle" x="581" y="-519.25" font-family="Helvetica,sans-Serif" font-size="13.00" fill="white">5. Unpublished → Rejected(NotPublished).</text>
<text xml:space="preserve" text-anchor="middle" x="581" y="-503.5" font-family="Helvetica,sans-Serif" font-size="13.00" fill="white">6. Count ≥ capacity → Rejected(Full).</text>
<text xml:space="preserve" text-anchor="middle" x="581" y="-487.75" font-family="Helvetica,sans-Serif" font-size="13.00" fill="white">7. Insert seat and COMMIT.</text>
<text xml:space="preserve" text-anchor="middle" x="581" y="-474.25" font-family="Helvetica,sans-Serif" font-size="13.00" fill="white">8. Send one confirmation; return Created + mail status.</text>
