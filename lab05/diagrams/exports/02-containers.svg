<text xml:space="preserve" text-anchor="middle" x="178.28" y="-450.03" font-family="Helvetica,sans-Serif" font-size="12.00">Grey = external system; arrow label = mechanism + data.</text>
<text xml:space="preserve" text-anchor="middle" x="178.28" y="-437.28" font-family="Helvetica,sans-Serif" font-size="12.00">One Python backend is manageable for a small team</text>
<text xml:space="preserve" text-anchor="middle" x="178.28" y="-424.53" font-family="Helvetica,sans-Serif" font-size="12.00">and 200 students; PostgreSQL serialises seat writes.</text>
<text xml:space="preserve" text-anchor="middle" x="178.28" y="-411.78" font-family="Helvetica,sans-Serif" font-size="12.00">External protocols are design assumptions, not supplied APIs.</text>
<text xml:space="preserve" text-anchor="middle" x="178.28" y="-399.03" font-family="Helvetica,sans-Serif" font-size="12.00">Refresh queries stored data; browser state is not authoritative.</text>
