<!-- invariant -->
<g id="node8" class="node">
<title>invariant</title>
<polygon fill="#fffbeb" stroke="#d97706" points="1486.65,-185.04 991.35,-185.04 991.35,0 1492.65,0 1492.65,-179.04 1486.65,-185.04"/>
<polyline fill="none" stroke="#d97706" points="1486.65,-185.04 1486.65,-179.04"/>
<polyline fill="none" stroke="#d97706" points="1492.65,-179.04 1486.65,-179.04"/>
<text xml:space="preserve" text-anchor="middle" x="1242" y="-161.17" font-family="Helvetica,sans-Serif" font-size="13.00">INVARIANT / OVERLAPPING CALLS</text>
<text xml:space="preserve" text-anchor="middle" x="1242" y="-147.67" font-family="Helvetica,sans-Serif" font-size="13.00">0 ≤ stored reservations per workshop ≤ capacity; at most one per student.</text>
<text xml:space="preserve" text-anchor="middle" x="1242" y="-134.17" font-family="Helvetica,sans-Serif" font-size="13.00">Every insert first locks the SAME workshop row with SELECT ... FOR UPDATE.</text>
<text xml:space="preserve" text-anchor="middle" x="1242" y="-120.67" font-family="Helvetica,sans-Serif" font-size="13.00">Keep that lock through duplicate lookup, count, insert and commit.</text>
<text xml:space="preserve" text-anchor="middle" x="1242" y="-107.17" font-family="Helvetica,sans-Serif" font-size="13.00">Use READ COMMITTED with fresh reads AFTER acquiring the lock.</text>
<text xml:space="preserve" text-anchor="middle" x="1242" y="-93.67" font-family="Helvetica,sans-Serif" font-size="13.00">A waiting request then sees the first request&#39;s committed seat.</text>
<text xml:space="preserve" text-anchor="middle" x="1242" y="-80.17" font-family="Helvetica,sans-Serif" font-size="13.00">UNIQUE(workshop_id, student_id) independently rejects duplicates.</text>
<text xml:space="preserve" text-anchor="middle" x="1242" y="-66.67" font-family="Helvetica,sans-Serif" font-size="13.00">Capacity is fixed at creation; no edit/cancel/unpublish operation in this scope.</text>
<text xml:space="preserve" text-anchor="middle" x="1242" y="-53.17" font-family="Helvetica,sans-Serif" font-size="13.00">An existing reservation wins over the full check and never triggers mail.</text>
<text xml:space="preserve" text-anchor="middle" x="1242" y="-39.67" font-family="Helvetica,sans-Serif" font-size="13.00">Mail is outside the transaction, so its failure cannot remove a seat.</text>
<text xml:space="preserve" text-anchor="middle" x="1242" y="-26.17" font-family="Helvetica,sans-Serif" font-size="13.00">LEGEND: solid arrow = call/data flow; dashed arrow = type dependency.</text>
<text xml:space="preserve" text-anchor="middle" x="1242" y="-12.67" font-family="Helvetica,sans-Serif" font-size="13.00">Blue boundary = selected component; grey = supporting components.</text>
</g>
